name: Pages

# GitHub Pages can only serve the repository root or /docs on its own, and the
# site lives in page/ — so it is published as an Actions artifact instead, which
# works from any directory. Set Settings → Pages → Source to "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "page/**"
      - "docs/images/**"
      - "packaging/icons/sonero-128.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# One deployment at a time; a queued run supersedes an older one rather than
# racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # The same script you run locally, so a preview cannot differ from what
      # ships.
      - name: Assemble the site
        run: ./page/build.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: page/_site

      - id: deploy
        uses: actions/deploy-pages@v4
