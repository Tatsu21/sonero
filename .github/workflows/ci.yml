name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Publishing a release re-runs the build and attaches its packages to it, so
  # what ships is built from the tagged commit rather than uploaded by hand.
  release:
    types: [published]

jobs:
  build:
    # A .deb links against the distribution's own Qt, so it can only be installed
    # on the distribution it was built on. Build one per target base:
    #
    #   ubuntu-22.04  ->  Ubuntu 22.04, Linux Mint 21.x   (Qt 6.2)
    #   ubuntu-24.04  ->  Ubuntu 24.04, Linux Mint 22.x   (Qt 6.4)
    #
    # Debian users build locally with packaging/deb/build-deb.sh. Anyone else uses
    # the AppImage, which carries its own Qt.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: mint21-ubuntu2204
            appimage: true   # oldest glibc -> the AppImage runs on the most systems
          - runner: ubuntu-24.04
            target: mint22-ubuntu2404
            appimage: false

    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.target }}

    steps:
      # fetch-depth: 0 — the version comes from the latest release tag, and the
      # default shallow checkout fetches no tags at all, so every build would
      # quietly fall back to the number in CMakeLists.txt.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config dpkg-dev \
            qt6-base-dev qt6-base-dev-tools qt6-wayland qt6-wayland-dev \
            libpipewire-0.3-dev desktop-file-utils file \
            libgl-dev libegl-dev

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      # Fail here rather than at publish. The packages are named from this
      # number, so a wrong one wastes the whole run and, worse, is only noticed
      # once the release is already public.
      - name: The version must be the tag's
        if: github.event_name == 'release'
        run: |
          ./packaging/check-release-version.sh build/sonero-version.txt \
            "${{ github.event.release.tag_name }}"

      - name: Build Debian package
        run: ./packaging/deb/build-deb.sh dist

      - name: Show what the package requires
        run: dpkg-deb -f dist/*.deb Package Version Depends Recommends

      - name: Build AppImage
        if: matrix.appimage
        run: ./packaging/appimage/build-appimage.sh dist

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Sonero-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/*.AppImage

  # Arch and Fedora ship no package of their own — their users build from source
  # or take the AppImage. They are in CI because rolling/fast-moving toolchains
  # break the build long before the Ubuntu LTS runners notice: GCC 15+ dropped
  # the transitive <unistd.h> the tests relied on, and Arch's -z pack-relative-relocs
  # produces .relr.dyn sections that linuxdeploy's bundled strip cannot read.
  rolling:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arch
            image: archlinux:latest
          - name: fedora
            image: fedora:latest

    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    name: ${{ matrix.name }}

    steps:
      # Dependencies first: with git present, checkout clones instead of
      # falling back to a tarball download.
      - name: Install build dependencies (Arch)
        if: matrix.name == 'arch'
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja git qt6-base qt6-wayland libpipewire \
            desktop-file-utils file curl

      - name: Install build dependencies (Fedora)
        if: matrix.name == 'fedora'
        run: |
          dnf -y install \
            gcc-c++ cmake ninja-build pkgconf-pkg-config git \
            qt6-qtbase-devel qt6-qtwayland-devel pipewire-devel \
            desktop-file-utils file curl

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags: see the build job

      # These jobs run in a container as root while the checkout is owned by the
      # runner user, and git refuses to read a repository it considers foreign.
      # When that happens the tag lookup returns nothing and the build quietly
      # calls itself the fallback version — which is how a 0.1.0 release ended up
      # with 0.0.0 Arch and Fedora packages.
      - name: Let git read the checkout from inside the container
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: The version must be the tag's
        if: github.event_name == 'release'
        run: |
          ./packaging/check-release-version.sh build/sonero-version.txt \
            "${{ github.event.release.tag_name }}"

      # Runs on both so that bundling regressions surface on whichever
      # distribution triggers them, and ships alongside the portable build for
      # users on a distribution as new as this one.
      - name: Build AppImage
        run: ./packaging/appimage/build-appimage.sh dist

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Sonero-${{ matrix.name }}
          path: dist/*.AppImage
          if-no-files-found: error

  # Attaches the packages to the release that triggered this run. Skipped on
  # every other event.
  publish:
    if: github.event_name == 'release'
    needs: [build, rolling]  # the release carries packages from both
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release upload writes to the repository

    steps:
      # Before the download: actions/checkout deletes the contents of the
      # workspace when it finds no .git there, which would take the artifacts
      # with it.
      - uses: actions/checkout@v4  # for packaging/collect-artifacts.sh

      # Every package this run produced, each artifact in its own directory:
      # merging them would be silent data loss, since all three AppImages are
      # called Sonero-<version>-x86_64.AppImage.
      - uses: actions/download-artifact@v4
        with:
          pattern: Sonero-*
          path: artifacts

      - name: Collect the packages under names that do not collide
        run: ./packaging/collect-artifacts.sh artifacts dist

      # The version is derived from this very tag, so the packages should already
      # carry it. If one does not, the build resolved something else — a checkout
      # that fetched no tags falling back to CMakeLists.txt is the likely cause —
      # and these files would be published under a name that contradicts the
      # release they sit under.
      - name: Check the packages carry the release version
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          for f in dist/*; do
            case "$(basename "${f}")" in
              *"${version}"*) ;;
              *) echo "::error::$(basename "${f}") is not version ${version}"; exit 1 ;;
            esac
          done
          echo "every package carries ${version}"

      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release upload "${{ github.event.release.tag_name }}" dist/* \
            --clobber --repo "${{ github.repository }}"

  # Every push to main refreshes one prerelease, so the newest build of the
  # development branch has a permanent, public link — Actions artifacts expire and
  # need a GitHub login to download.
  #
  # The release is deleted and recreated rather than edited: the tag has to move to
  # the new commit, and recreating is the one operation that always leaves the tag,
  # the target and the files agreeing. Creating it with GITHUB_TOKEN does not
  # re-trigger this workflow's `release` event, so it cannot loop.
  #
  # Two repository settings have to allow this, and the job says so plainly when
  # they do not:
  #   * Immutable releases must be OFF. An immutable release owns its tag name for
  #     good, which is the opposite of a tag that moves on every push. This is why
  #     the tag is `dev` and not `nightly` — `nightly` was published immutably once
  #     and can never be reused.
  #   * The tag ruleset must not restrict creations for `dev` (exclude it, or give
  #     the Actions bot a bypass), or the recreated tag is rejected.
  dev-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, rolling]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4  # first: it would wipe the downloaded artifacts

      - uses: actions/download-artifact@v4
        with:
          pattern: Sonero-*
          path: artifacts

      - name: Collect the packages under names that do not collide
        run: ./packaging/collect-artifacts.sh artifacts dist

      - name: Refresh the development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: dev
        run: |
          # Not a release: no version was cut for it, and it is rebuilt from
          # whatever main happens to hold. Say so where people will read it.
          notes="$(printf '%s\n' \
            "Automatic build of \`main\`, replaced on every push. **Not a release** —" \
            "for a version that was actually cut, use the Releases page." \
            "" \
            "Commit: ${GITHUB_SHA}" \
            "Built: $(date -u '+%Y-%m-%d %H:%M UTC')" \
            "" \
            "\`Sonero-*-x86_64.AppImage\` without a distribution in the name is the" \
            "portable one — built on the oldest glibc, so it runs almost anywhere." \
            "The \`-arch\` and \`-fedora\` builds need a distribution at least as new.")"

          # Only delete what exists. The previous version swallowed every failure
          # here with `|| true`, so a refused deletion surfaced later as a
          # confusing "release already exists" from the create below.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if ! gh release delete "${TAG}" --yes --cleanup-tag \
                   --repo "${GITHUB_REPOSITORY}"; then
              echo "::error::could not remove the previous ${TAG} release. If this" \
                   "mentions an immutable release, turn Immutable releases off in" \
                   "Settings → General; a moving tag cannot coexist with it."
              exit 1
            fi
          fi

          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Development build (main)" \
            --notes "${notes}" \
            --prerelease
