name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Publishing a release re-runs the build and attaches its packages to it, so
  # what ships is built from the tagged commit rather than uploaded by hand.
  release:
    types: [published]

jobs:
  build:
    # A .deb links against the distribution's own Qt, so it can only be installed
    # on the distribution it was built on. Build one per target base:
    #
    #   ubuntu-22.04  ->  Ubuntu 22.04, Linux Mint 21.x   (Qt 6.2)
    #   ubuntu-24.04  ->  Ubuntu 24.04, Linux Mint 22.x   (Qt 6.4)
    #
    # Debian 13 is built by the `debian` job below — GitHub offers no Debian
    # runner, so it needs a container. Anyone else uses the AppImage, which
    # carries its own Qt.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: mint21-ubuntu2204
            appimage: true   # oldest glibc -> the AppImage runs on the most systems
          - runner: ubuntu-24.04
            target: mint22-ubuntu2404
            appimage: false

    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.target }}

    steps:
      # fetch-depth: 0 — the version comes from the latest release tag, and the
      # default shallow checkout fetches no tags at all, so every build would
      # quietly fall back to the number in CMakeLists.txt.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config dpkg-dev \
            qt6-base-dev qt6-base-dev-tools qt6-wayland qt6-wayland-dev \
            libpipewire-0.3-dev desktop-file-utils file \
            libgl-dev libegl-dev

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      # Fail here rather than at publish. The packages are named from this
      # number, so a wrong one wastes the whole run and, worse, is only noticed
      # once the release is already public.
      - name: The version must be the tag's
        if: github.event_name == 'release'
        run: |
          ./packaging/check-release-version.sh build/sonero-version.txt \
            "${{ github.event.release.tag_name }}"

      - name: Build Debian package
        run: ./packaging/deb/build-deb.sh dist

      - name: Show what the package requires
        run: dpkg-deb -f dist/*.deb Package Version Depends Recommends

      - name: Build AppImage
        if: matrix.appimage
        run: ./packaging/appimage/build-appimage.sh dist

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Sonero-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/*.AppImage

  # Debian 13 (trixie), the same .deb as the build job but for Debian's own Qt
  # 6.8. It cannot join that matrix: GitHub hosts no Debian runner, so this runs
  # in a container, which changes enough of the steps (no sudo, git has to be
  # installed before the checkout, safe.directory) to be worth its own job.
  debian:
    runs-on: ubuntu-latest
    container: debian:13
    name: debian13

    steps:
      # Before the checkout: with git present it clones — and so can see the
      # tags the version comes from — instead of downloading a tarball.
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config dpkg-dev \
            git ca-certificates \
            qt6-base-dev qt6-base-dev-tools libpipewire-0.3-dev file \
            libgl-dev libegl-dev

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags: see the build job

      # The container is root while the checkout belongs to the runner user, and
      # git refuses to read a repository it considers foreign — which is how a
      # release once shipped 0.0.0 packages. See the rolling job.
      - name: Let git read the checkout from inside the container
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: The version must be the tag's
        if: github.event_name == 'release'
        run: |
          ./packaging/check-release-version.sh build/sonero-version.txt \
            "${{ github.event.release.tag_name }}"

      - name: Build Debian package
        run: ./packaging/deb/build-deb.sh dist

      - name: Show what the package requires
        run: dpkg-deb -f dist/*.deb Package Version Depends Recommends

      # The one thing inspecting the file cannot tell you: that apt resolves
      # every dependency the package declares, from Debian's own archive. Not a
      # pristine system — the build dependencies are already here — so it proves
      # the declared dependencies exist and install, not that the list is
      # complete. build-deb-docker.sh does the pristine-container check.
      - name: The package must install and resolve its libraries
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y ./dist/*.deb
          # `... | grep && exit 1` would be the obvious spelling and is wrong:
          # grep exits 1 when it finds nothing, and set -e then fails the step
          # for a package that is perfectly fine.
          if ldd /usr/bin/Sonero | grep "not found"; then
            echo "::error::the package leaves libraries unresolved"
            exit 1
          fi
          echo "installed $(dpkg-query -W -f='${Version}' sonero), libraries all resolved"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Sonero-debian13
          path: dist/*.deb
          if-no-files-found: error

  # Arch and Fedora ship no package of their own — their users build from source
  # or take the AppImage. They are in CI because rolling/fast-moving toolchains
  # break the build long before the Ubuntu LTS runners notice: GCC 15+ dropped
  # the transitive <unistd.h> the tests relied on, and Arch's -z pack-relative-relocs
  # produces .relr.dyn sections that linuxdeploy's bundled strip cannot read.
  rolling:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arch
            image: archlinux:latest
          - name: fedora
            image: fedora:latest

    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    name: ${{ matrix.name }}

    steps:
      # Dependencies first: with git present, checkout clones instead of
      # falling back to a tarball download.
      - name: Install build dependencies (Arch)
        if: matrix.name == 'arch'
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja git qt6-base qt6-wayland libpipewire \
            desktop-file-utils file curl

      - name: Install build dependencies (Fedora)
        if: matrix.name == 'fedora'
        run: |
          dnf -y install \
            gcc-c++ cmake ninja-build pkgconf-pkg-config git \
            qt6-qtbase-devel qt6-qtwayland-devel pipewire-devel \
            desktop-file-utils file curl

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags: see the build job

      # These jobs run in a container as root while the checkout is owned by the
      # runner user, and git refuses to read a repository it considers foreign.
      # When that happens the tag lookup returns nothing and the build quietly
      # calls itself the fallback version — which is how a 0.1.0 release ended up
      # with 0.0.0 Arch and Fedora packages.
      - name: Let git read the checkout from inside the container
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: The version must be the tag's
        if: github.event_name == 'release'
        run: |
          ./packaging/check-release-version.sh build/sonero-version.txt \
            "${{ github.event.release.tag_name }}"

      # Runs on both so that bundling regressions surface on whichever
      # distribution triggers them, and ships alongside the portable build for
      # users on a distribution as new as this one.
      - name: Build AppImage
        run: ./packaging/appimage/build-appimage.sh dist

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Sonero-${{ matrix.name }}
          path: dist/*.AppImage
          if-no-files-found: error

  # The AUR is the one channel where a broken package is the user's problem and
  # not a red CI run: `yay -S sonero` builds from the PKGBUILD as pushed, on the
  # user's machine, with no binary in between. So the package is built here the
  # same way makepkg will build it there.
  aur:
    runs-on: ubuntu-latest
    container: archlinux:latest
    name: aur

    steps:
      - name: Install packaging tools and build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git namcap cmake ninja qt6-base libpipewire \
            hicolor-icon-theme

      - uses: actions/checkout@v4

      # makepkg refuses to run as root, and the container is root. The checkout
      # is root-owned too, so the build user needs it handed over.
      - name: Create a build user
        run: |
          useradd -m builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      # .SRCINFO is what the AUR itself reads — its search, its dependency
      # solving, the web page. A PKGBUILD edit that forgets to regenerate it
      # looks perfectly fine in review and wrong to everyone installing.
      - name: .SRCINFO must match its PKGBUILD
        run: |
          for pkg in sonero sonero-git; do
            dir="${GITHUB_WORKSPACE}/packaging/aur/${pkg}"
            if ! diff -u "${dir}/.SRCINFO" \
                 <(su builder -s /bin/bash -c "cd '${dir}' && makepkg --printsrcinfo"); then
              echo "::error::${pkg}/.SRCINFO is stale — run ./packaging/aur/gen-srcinfo.sh"
              exit 1
            fi
            echo "${pkg}: .SRCINFO matches"
          done

      - name: Lint both PKGBUILDs
        run: |
          namcap packaging/aur/sonero/PKGBUILD
          namcap packaging/aur/sonero-git/PKGBUILD

      # The release package, built from the tarball the AUR points at. Runs the
      # test suite too — check() is part of makepkg's default run.
      - name: Build the package
        working-directory: packaging/aur/sonero
        run: su builder -s /bin/bash -c "cd '${PWD}' && makepkg --noconfirm"

      # The version is normally read from a git tag, and a release tarball has
      # none: a packaging mistake here does not fail anything, it just ships a
      # binary whose About box disagrees with pacman. Compare what the configure
      # resolved against what the package is called.
      - name: The binary must carry the version the package claims
        working-directory: packaging/aur/sonero
        run: |
          pkgver="$(awk -F= '/^pkgver=/{print $2}' PKGBUILD)"
          resolved="$(tr -d '[:space:]' < src/build/sonero-version.txt)"
          echo "package ${pkgver}, binary ${resolved}"
          if [ "${pkgver}" != "${resolved}" ]; then
            echo "::error::the package is ${pkgver} but the build resolved ${resolved}"
            exit 1
          fi

      - name: Lint the built package
        working-directory: packaging/aur/sonero
        run: namcap ./*.pkg.tar.zst || true  # advisory: namcap warns about plenty

  # Attaches the packages to the release that triggered this run. Skipped on
  # every other event.
  publish:
    if: github.event_name == 'release'
    needs: [build, debian, rolling]  # the release carries packages from all three
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release upload writes to the repository

    steps:
      # Before the download: actions/checkout deletes the contents of the
      # workspace when it finds no .git there, which would take the artifacts
      # with it.
      - uses: actions/checkout@v4  # for packaging/collect-artifacts.sh

      # Every package this run produced, each artifact in its own directory:
      # merging them would be silent data loss, since all three AppImages are
      # called Sonero-<version>-x86_64.AppImage.
      - uses: actions/download-artifact@v4
        with:
          pattern: Sonero-*
          path: artifacts

      - name: Collect the packages under names that do not collide
        run: ./packaging/collect-artifacts.sh artifacts dist

      # The version is derived from this very tag, so the packages should already
      # carry it. If one does not, the build resolved something else — a checkout
      # that fetched no tags falling back to CMakeLists.txt is the likely cause —
      # and these files would be published under a name that contradicts the
      # release they sit under.
      - name: Check the packages carry the release version
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          for f in dist/*; do
            case "$(basename "${f}")" in
              *"${version}"*) ;;
              *) echo "::error::$(basename "${f}") is not version ${version}"; exit 1 ;;
            esac
          done
          echo "every package carries ${version}"

      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release upload "${{ github.event.release.tag_name }}" dist/* \
            --clobber --repo "${{ github.repository }}"

  # --- Getting the release into the AUR ----------------------------------------
  #
  # The AUR never looks at GitHub: it serves the PKGBUILD that was pushed to it,
  # and nothing else. These two jobs are what turns "a release exists" into "the
  # AUR has it", and they are split on purpose.
  #
  # The first does the work and proves it — points the package at the new tag,
  # regenerates .SRCINFO, then builds and tests it from the tarball that was
  # actually published. The second is the only part that touches anything
  # outside this repository, and it waits for a human. Approving a push that had
  # not been built yet would be approving nothing.
  aur-prepare:
    if: github.event_name == 'release'
    needs: [aur]
    runs-on: ubuntu-latest
    container: archlinux:latest
    name: aur-prepare

    steps:
      - name: Install packaging tools and build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git curl cmake ninja qt6-base libpipewire hicolor-icon-theme

      # main rather than the tag: the version bump is a commit on the branch. The
      # release's own code arrives as the source tarball the PKGBUILD downloads,
      # which is the whole point — that tarball is what users will build.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Create a build user
        run: |
          useradd -m builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      # Downloads the published tarball and derives its checksum — the one thing
      # nobody should ever type by hand, since a wrong one breaks every install
      # at once and the AUR keeps no copy of the source to check against.
      - name: Point the package at the new release
        run: |
          su builder -s /bin/bash -c \
            "cd '${GITHUB_WORKSPACE}' && ./packaging/aur/update-version.sh '${TAG}'"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: The package must be the version the release names
        run: |
          expected="${TAG#v}"
          pkgver="$(awk -F= '/^pkgver=/{print $2}' packaging/aur/sonero/PKGBUILD)"
          echo "package ${pkgver}, release ${expected}"
          if [ "${pkgver}" != "${expected}" ]; then
            echo "::error::the PKGBUILD says ${pkgver} but the release is ${expected}"
            exit 1
          fi
        env:
          TAG: ${{ github.event.release.tag_name }}

      # The real thing: makepkg from the published tarball, check() and all. If
      # this fails, the AUR is better off still serving the previous release.
      - name: Build the new package
        working-directory: packaging/aur/sonero
        run: su builder -s /bin/bash -c "cd '${PWD}' && makepkg --noconfirm"

      - name: The binary must carry the release version
        working-directory: packaging/aur/sonero
        run: |
          pkgver="$(awk -F= '/^pkgver=/{print $2}' PKGBUILD)"
          resolved="$(tr -d '[:space:]' < src/build/sonero-version.txt)"
          echo "package ${pkgver}, binary ${resolved}"
          if [ "${pkgver}" != "${resolved}" ]; then
            echo "::error::the package is ${pkgver} but the build resolved ${resolved}"
            exit 1
          fi

      # include-hidden-files: .SRCINFO starts with a dot, and without this it is
      # dropped silently — the publish job would then push a PKGBUILD with a
      # stale .SRCINFO beside it, which is the one inconsistency the AUR shows
      # to every user and to nobody in review.
      - name: Hand the updated package to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: aur-sonero
          path: |
            packaging/aur/sonero/PKGBUILD
            packaging/aur/sonero/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error

  # The gate. `environment: aur` is what makes a run stop here and wait for you —
  # but only if that environment carries a required-reviewer rule. Create it at
  # Settings -> Environments -> aur and add yourself; without the rule this job
  # runs straight through and the split above buys nothing.
  #
  # Needs `publish` as well: the AUR should not start handing out a version whose
  # packages never made it onto the release page.
  aur-publish:
    if: github.event_name == 'release'
    needs: [aur-prepare, publish]
    runs-on: ubuntu-latest
    name: aur-publish
    environment: aur
    permissions:
      contents: write  # the version bump is committed back to main

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: aur-sonero
          path: packaging/aur/sonero

      # main and the AUR carry the same PKGBUILD by definition, so the bump is
      # committed here rather than left for someone to remember afterwards.
      - name: Commit the bump to main
        run: |
          version="$(awk -F= '/^pkgver=/{print $2}' packaging/aur/sonero/PKGBUILD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/aur/sonero
          if git diff --cached --quiet; then
            echo "main already carries ${version}"
          else
            # No [skip ci] on purpose: this commit is what CI's own .SRCINFO and
            # namcap checks should see.
            git commit -m "aur: ${version}"
            git push origin HEAD:main
          fi

      - name: Trust the AUR's host key, and nothing else
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Pinned, not scanned: ssh-keyscan trusts whatever answers, and what
          # this job pushes is what every `yay -S sonero` then compiles. Check it
          # against the fingerprint the AUR publishes on its front page:
          #   SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          # If the AUR ever rotates its key, this line is what has to change.
          printf '%s\n' \
            'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > ~/.ssh/known_hosts

      - name: Load the AUR key
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "${AUR_SSH_KEY}" ]; then
            echo "::error::the AUR_SSH_KEY secret is not set — add the private key" \
                 "whose public half is registered on your AUR account"
            exit 1
          fi
          umask 077
          printf '%s\n' "${AUR_SSH_KEY}" > ~/.ssh/aur
          printf '%s\n' 'Host aur.archlinux.org' '  User aur' \
                        '  IdentityFile ~/.ssh/aur' '  IdentitiesOnly yes' \
            > ~/.ssh/config

      # The same script a person would run by hand, with the same checks.
      - name: Push to the AUR
        run: |
          git config --global user.name "Radu Cristian"
          git config --global user.email "37669757+Tatsu21@users.noreply.github.com"
          ./packaging/aur/sync-to-aur.sh sonero --push

  # Every push to main refreshes one prerelease, so the newest build of the
  # development branch has a permanent, public link — Actions artifacts expire and
  # need a GitHub login to download.
  #
  # The release is deleted and recreated rather than edited: the tag has to move to
  # the new commit, and recreating is the one operation that always leaves the tag,
  # the target and the files agreeing. Creating it with GITHUB_TOKEN does not
  # re-trigger this workflow's `release` event, so it cannot loop.
  #
  # Two repository settings have to allow this, and the job says so plainly when
  # they do not:
  #   * Immutable releases must be OFF. An immutable release owns its tag name for
  #     good, which is the opposite of a tag that moves on every push. This is why
  #     the tag is `dev` and not `nightly` — `nightly` was published immutably once
  #     and can never be reused.
  #   * The tag ruleset must not restrict creations for `dev` (exclude it, or give
  #     the Actions bot a bypass), or the recreated tag is rejected.
  dev-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, debian, rolling]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4  # first: it would wipe the downloaded artifacts

      - uses: actions/download-artifact@v4
        with:
          pattern: Sonero-*
          path: artifacts

      - name: Collect the packages under names that do not collide
        run: ./packaging/collect-artifacts.sh artifacts dist

      - name: Refresh the development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: dev
        run: |
          # Not a release: no version was cut for it, and it is rebuilt from
          # whatever main happens to hold. Say so where people will read it.
          notes="$(printf '%s\n' \
            "Automatic build of \`main\`, replaced on every push. **Not a release** —" \
            "for a version that was actually cut, use the Releases page." \
            "" \
            "Commit: ${GITHUB_SHA}" \
            "Built: $(date -u '+%Y-%m-%d %H:%M UTC')" \
            "" \
            "\`Sonero-*-x86_64.AppImage\` without a distribution in the name is the" \
            "portable one — built on the oldest glibc, so it runs almost anywhere." \
            "The \`-arch\` and \`-fedora\` builds need a distribution at least as new.")"

          # Only delete what exists. The previous version swallowed every failure
          # here with `|| true`, so a refused deletion surfaced later as a
          # confusing "release already exists" from the create below.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if ! gh release delete "${TAG}" --yes --cleanup-tag \
                   --repo "${GITHUB_REPOSITORY}"; then
              echo "::error::could not remove the previous ${TAG} release. If this" \
                   "mentions an immutable release, turn Immutable releases off in" \
                   "Settings → General; a moving tag cannot coexist with it."
              exit 1
            fi
          fi

          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Development build (main)" \
            --notes "${notes}" \
            --prerelease
